<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Detalle del Producto</h1>
    </header>

    <main class="detalle-container">

        <img src="https://via.placeholder.com/350x220" alt="Producto" class="detalle-img">

        <h2>Audífonos Bluetooth</h2>

        <p>
            Audífonos inalámbricos con cancelación de ruido,
            batería de larga duración y excelente calidad de sonido.
        </p>

        <h3>Formulario de compra</h3>

        <form id="formulario">
            <input type="text" placeholder="Nombre completo" required>

            <input type="email" placeholder="Correo electrónico" required>

            <input type="number" placeholder="Cantidad" required>

            <button type="submit">Comprar</button>
        </form>

        <a href="index.html" class="btn regresar">← Regresar</a>

    </main>

    <script src="script.js"></script>
</body>
</html>
